name: Build & Upload iOS
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          V=4.7.2-stable
          for BASE in https://github.com/godotengine/godot-builds/releases/download https://github.com/godotengine/godot/releases/download; do
            curl -fLO "$BASE/$V/Godot_v${V}_macos.universal.zip" && curl -fLO "$BASE/$V/Godot_v${V}_export_templates.tpz" && break
          done
          unzip -q Godot_v${V}_macos.universal.zip
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.7.2.stable
          unzip -q Godot_v${V}_export_templates.tpz -d /tmp/tpl
          cp -R /tmp/tpl/templates/* ~/Library/Application\ Support/Godot/export_templates/4.7.2.stable/

      - name: Import signing cert
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Install provisioning profile
        env:
          PROVISION_PROFILE: ${{ secrets.PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Export from Godot
        run: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --import || true
          ./Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/kinblox.xcodeproj
          ls -R build/ios | head -50

      - name: Archive and export IPA
        run: |
          cd build/ios
          xcodebuild -list -project kinblox.xcodeproj
          xcodebuild -project kinblox.xcodeproj -scheme kinblox -configuration Release -archivePath kinblox.xcarchive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=9U2ANXC444 PROVISIONING_PROFILE_SPECIFIER="decoded_profile" CODE_SIGN_IDENTITY="Apple Distribution" archive
          xcodebuild -exportArchive -archivePath kinblox.xcarchive -exportPath . -exportOptionsPlist ../../ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls build/ios/*.ipa | head -1)
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
